services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caos}
      POSTGRES_USER: ${POSTGRES_USER:-caos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caos} -d ${POSTGRES_DB:-caos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-caos}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-caos}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STEPIK_CLIENT_ID: ${STEPIK_CLIENT_ID:-}
      STEPIK_CLIENT_SECRET: ${STEPIK_CLIENT_SECRET:-}
      STEPIK_REDIRECT_URI: ${STEPIK_REDIRECT_URI:-http://localhost:8000/api/v1/auth/stepik/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@caos.thinkred.ru}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host nginx (TLS) proxies api-caos.thinkred.ru here; no direct
      # external access bypassing TLS.
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      # Host nginx (TLS) proxies caos.thinkred.ru here.
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:

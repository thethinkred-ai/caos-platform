name: Deploy to VPS

# Deploy only after CI has passed on main - never deploy red builds.
# The production runtime is Docker Compose (project "caos-platform"):
# backend AND frontend ship as rebuilt containers. The legacy TimeWeb
# FTP mirror was removed - its credentials were compromised and rotated;
# the public DNS currently still points at TimeWeb (see CURRENT_STATE.md).
on:
  workflow_run:
    workflows: ["CAOS CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend and frontend to VPS (Docker runtime)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/caos
            git pull origin main

            # Backup the running database before any schema change
            # (pg_dump inside the db container - no host credentials needed).
            STAMP=$(date +%Y%m%d_%H%M%S)
            docker compose -p caos-platform exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'               > "/opt/caos/backup-pre-migration-$STAMP.sql"
            test -s "/opt/caos/backup-pre-migration-$STAMP.sql" || { echo "backup is empty, aborting"; exit 1; }

            # Build new images, migrate via a one-off container while the
            # old containers keep serving, then recreate the services.
            docker compose -p caos-platform build backend frontend
            docker compose -p caos-platform run --rm --no-deps backend python -m alembic upgrade head
            docker compose -p caos-platform up -d --remove-orphans backend frontend
            # Health checks with retry: a container recreated moments ago may
            # still be booting - a single immediate probe once failed the whole
            # deploy (2026-11-07: raced a concurrent manual deploy).
            ok=""
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 \
                 && [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/goals/1/impact)" = "401" ]; then
                ok=1; break
              fi
              sleep 5
            done
            [ -n "$ok" ] || { echo "health checks failed after 60s"; exit 1; }

            # Idempotently install the daily backup job (Step 23).
            # Script and cron file are versioned in scripts/; retention
            # and the restore procedure: docs/operations/backup-restore.md
            install -m 755 scripts/caos-backup.sh /usr/local/bin/caos-backup.sh
            install -m 644 scripts/caos-backup.cron /etc/cron.d/caos-backup

            # Keep the build cache bounded - it once filled the disk (Step 23 lesson).
            docker builder prune -f --keep-storage 1GB >/dev/null
